version: '3.8'

services:
  worker:
    build: 
      context: .
      dockerfile: Dockerfile.cc_x86_to_x86
    environment:
      - WORKER_ID=1
      - CONTROLLER_GRPC_ADDR=controller:50051
      - PUSH_GATEWAY_ADDR=pushgateway
      - PUSH_GATEWAY_PORT=9091
    volumes:
      - ./data:/data 
    working_dir: /data
    logging:
      driver: loki 
      options:
          loki-timeout: 10s
          no-file: "true"
          loki-external-labels: "container_name={{.Name}}"
          labels: "container_name, host"
          loki-url:  "http://${LOKI_IP}:${LOG_PORT}/loki/api/v1/push"