name: go tests

on: [push]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        working-directory: ./controller/service
        run: go mod download

      - name: Run tests url database
        working-directory: ./controller/service/tests
        env:
          KASPERSKY_API_KEY: ${{ secrets.KASPERSKY_API_KEY }}
        run: |
          echo "KASPERSKY_API_KEY=${KASPERSKY_API_KEY}" > .env
          go test ./...
  build:
    name: Build with Bazel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazel
        run: |
          wget https://github.com/bazelbuild/bazel/releases/download/7.4.1/bazel-7.4.1-linux-x86_64
          chmod +x bazel-7.4.1-linux-x86_64
          sudo mv bazel-7.4.1-linux-x86_64 /usr/local/bin/bazel

      - name: Build Controller
        working-directory: ./controller
        run: bazel build --check_direct_dependencies=off //cmd/grpc_server:grpc_server