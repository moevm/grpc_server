name: go tests

on: [push]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear Bazel cache
        run: |
          bazel clean --expunge
          rm -rf ~/.cache/bazel

      - name: Install Bazel via Bazelisk
        run: |
          sudo curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel

      - name: Prepare socket directory
        run: sudo mkdir -p /run/controller/ && sudo chown runner:runner /run/controller/ && sudo chmod 755 /run/controller/

      - name: Build Controller Components
        working-directory: ./controller
        run: |
          bazel build --check_direct_dependencies=off //cmd/grpc_server:grpc_server
          bazel build --check_direct_dependencies=off //cmd/manager:manager

      - name: Test
        run: |
          cd controller && bazel test --check_direct_dependencies=off --sandbox_writable_path=/run/controller --cache_test_results=no --test_arg=-test.v --test_output=streamed //...
