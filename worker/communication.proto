syntax = "proto3";
option go_package = "github.com/moevm/grpc_server/pkg/proto/communication";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

service DataService {
    rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
    rpc Classify(ClassifyRequest) returns (ClassifyResponse);
    rpc SendStats(StatsReport) returns (google.protobuf.Empty);
}

message GetPolicyRequest {
    uint64 worker_id = 1;
    uint64 config_version = 2;
}

message GetPolicyResponse {
    enum Result {
        POLICY_PROVIDED = 0;
        POLICY_UNCHANGED = 1;
    }
    
    Result result = 1;
    WorkerPolicy policy = 2;
}

message WorkerPolicy {
    repeated string block_categories = 1;
    map<string, int32> block_by_trust = 2;
    repeated string block_domains = 3;
    repeated string allow_domains = 4;
    repeated string block_ips = 5;
    repeated string allow_ips = 6;
    int32 min_trust_level = 7;
    int32 ttl_ip = 8;
    int32 ttl_domain = 9;
    uint64 config_version = 10;
    google.protobuf.Struct extra = 11;
}

message ClassifyRequest {
    uint64 worker_id = 1;
    string type = 2;  
    string target = 3;   
}

message ClassifyResponse {
    repeated string categories = 1;
    int32 trust_level = 2;
}

message ResourceStats {
    string domain = 1;
    uint64 blocked = 2;
    uint64 allowed = 3;
}

message StatsReport {
    uint64 worker_id = 1;
    uint64 time = 2;
    uint64 total_blocked = 3;
    uint64 total_allowed = 4;
    repeated ResourceStats resources = 5;
}
