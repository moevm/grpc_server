services:
  traffic-gen-1:
    build:
      context: .
      dockerfile: Dockerfile.traffic-gen
    networks:
      - testnet1
    cap_add:
      - NET_ADMIN
    dns:
      - ${DNS:-8.8.8.8}
      - ${DNS_V6:-2001:4860:4860::8888}
    deploy:
      replicas: ${NUM_HOSTS_NET1:-2}
    restart: unless-stopped

  traffic-gen-2:
    build:
      context: .
      dockerfile: Dockerfile.traffic-gen
    networks:
      - testnet2
    cap_add:
      - NET_ADMIN
    dns:
      - ${DNS:-8.8.8.8}
      - ${DNS_V6:-2001:4860:4860::8888}
    deploy:
      replicas: ${NUM_HOSTS_NET2:-2}
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  testnet1:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: "br-testnet1"
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${SUBNET1:-10.0.0}.0/24
          gateway: ${SUBNET1:-10.0.0}.254
        - subnet: ${SUBNET1_V6:-fd00:1::}0/64
          gateway: ${SUBNET1_V6:-fd00:1::}ff

  testnet2:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: "br-testnet2"
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${SUBNET2:-10.0.1}.0/24
          gateway: ${SUBNET2:-10.0.1}.254
        - subnet: ${SUBNET2_V6:-fd00:2::}0/64
          gateway: ${SUBNET2_V6:-fd00:2::}ff

volumes:
  grafana-data:
